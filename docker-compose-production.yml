services:
    swarm-cronjob:
        image: crazymax/swarm-cronjob:latest
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            LOG_LEVEL: info
        deploy:
            placement:
                constraints: [ node.role == manager ]
    gateway:
        image: ${REGISTRY}/auction-gateway:${IMAGE_TAG}
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - /var/www/html:/var/www/html:ro
        ports:
            - "80:80"
            - "443:443"
        deploy:
          mode: replicated
          replicas: 2
          update_config:
            parallelism: 1
            delay: 10s
          placement:
            constraints: [ node.role == manager ]

    frontend:
        image: ${REGISTRY}/auction-frontend:${IMAGE_TAG}
        deploy:
          mode: replicated
          replicas: 2
          update_config:
            parallelism: 1
            delay: 10s

    api:
        image: ${REGISTRY}/auction-api:${IMAGE_TAG}
        deploy:
          mode: replicated
          replicas: 2
          update_config:
            parallelism: 1
            delay: 5s

    api-migration:
        image: ${REGISTRY}/auction-api-php-cli:${IMAGE_TAG}
        environment:
            APP_DEBUG: 0
            APP_ENV: prod
            DB_HOST: api-postgres
            DB_USER: app
            DB_PASSWORD: ${API_DB_PASSWORD}
            DB_NAME: app
            MAILER_HOST: ${API_MAILER_HOST}
            MAILER_PORT: ${API_MAILER_PORT}
            MAILER_USER: ${API_MAILER_USER}
            MAILER_PASSWORD: ${API_MAILER_PASSWORD}
            MAILER_ENCRYPTION: tls
            MAILER_FROM_EMAIL: ${API_MAILER_FROM_EMAIL}
            FRONTEND_URL: https://auction.mywebdev.ru
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY}
            JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
            JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
        secrets:
            - jwt_public_key
            - jwt_private_key
        command: sh -c 'wait-for-it api-postgres:5432 -t 60 && php bin/migrations.php --ansi migrations:migrate --no-interaction'
        deploy:
          restart_policy:
            condition: on-failure
            delay: 5s
            max_attempts: 5
            window: 120s

    api-php-fpm:
        image: ${REGISTRY}/auction-api-php-fpm:${IMAGE_TAG}
        environment:
            APP_DEBUG: 0
            APP_ENV: prod
            DB_HOST: api-postgres
            DB_USER: app
            DB_PASSWORD: ${API_DB_PASSWORD}
            DB_NAME: app
            MAILER_HOST: ${API_MAILER_HOST}
            MAILER_PORT: ${API_MAILER_PORT}
            MAILER_USER: ${API_MAILER_USER}
            MAILER_PASSWORD: ${API_MAILER_PASSWORD}
            MAILER_ENCRYPTION: tls
            MAILER_FROM_EMAIL: ${API_MAILER_FROM_EMAIL}
            FRONTEND_URL: https://auction.mywebdev.ru
            SENTRY_DSN: ${SENTRY_DSN}
            JWT_ENCRYPTION_KEY: ${JWT_ENCRYPTION_KEY}
            JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
            JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
        secrets:
            - jwt_public_key
            - jwt_private_key
        deploy:
          mode: replicated
          replicas: 2
          update_config:
            parallelism: 1
            delay: 5s

    api-postgres:
        image: postgres:17.3-alpine
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: ${API_DB_PASSWORD}
            POSTGRES_DB: app
        volumes:
            - api-database:/var/lib/postgresql/data
        ports:
          - target: 5432
            published: 5432
            protocol: tcp
            mode: host
        deploy:
          placement:
            constraints: [ node.labels.db == db ]
          endpoint_mode: dnsrr
secrets:
    jwt_public_key:
        file: ./secrets/jwt_public.key
    jwt_private_key:
        file: ./secrets/jwt_private.key

volumes:
    api-database:
